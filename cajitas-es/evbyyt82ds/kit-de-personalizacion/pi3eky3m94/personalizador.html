<style>
:root{--bg:#F8F3EB;--paper:#FFFBF4;--ink:#26272A;--soft:#6A6D72;--ac:#39769A;--acd:#244F6B;--line:#E6E0D4;--gold:#B58A3B}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}
.top{background:var(--acd);color:#fff;text-align:center;padding:11px;font-family:'Playfair Display',serif;font-weight:700}
.wrap{max-width:1000px;margin:0 auto;padding:22px 16px 60px}
h1{font-family:'Playfair Display',serif;font-size:clamp(24px,5vw,36px);text-align:center;margin-bottom:6px}
.sub{text-align:center;color:var(--soft);margin-bottom:20px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
label{display:block;font-size:13px;font-weight:800;color:var(--acd);margin-bottom:5px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.full{grid-column:1/-1}
.cols{display:flex;gap:8px;flex-wrap:wrap}.cols button{width:36px;height:36px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.cols button.on{box-shadow:0 0 0 3px var(--ac)}
.acts{display:flex;gap:10px;justify-content:center;margin:18px 0}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px 26px;font:800 16px Inter;cursor:pointer;box-shadow:0 4px 0 var(--acd)}
.hint{text-align:center;color:var(--soft);font-size:13px;margin-bottom:14px}
.hoja{background:#fff;margin:0 auto;width:210mm;min-height:297mm;padding:10mm 12mm;display:grid;grid-template-columns:85mm 85mm;grid-auto-rows:52mm;gap:4mm;justify-content:center;box-shadow:0 6px 24px rgba(0,0,0,.08);transform-origin:top center}
.et{border:.3mm dashed #aab;border-radius:3mm;display:flex;align-items:center;gap:3mm;padding:3mm 4mm;overflow:hidden}
.et img{width:24mm;height:44mm;object-fit:cover;border-radius:2mm;flex:none}
.tx{flex:1;text-align:center;min-width:0}
.oc{font:700 9.5pt 'Playfair Display',serif;letter-spacing:.02em}
.no{font:400 22pt 'Great Vibes',cursive;line-height:1.15;margin:1mm 0;word-break:break-word}
.fe{font:600 8pt Inter}.pa{font:italic 8pt 'Playfair Display',serif;margin-top:.8mm}.me{font:7.5pt Inter;margin-top:1.2mm;opacity:.85}
.prev{overflow:auto;padding-bottom:10px}
@media (max-width:700px){.panel{grid-template-columns:1fr}.hoja{transform:scale(.45);margin-bottom:-160mm}}
@media print{@page{size:A4;margin:0}body{background:#fff}.top,.wrap>*:not(.prev){display:none!important}.wrap{padding:0;max-width:none}.prev{overflow:visible}.hoja{box-shadow:none;transform:none!important;margin:0!important}}
</style></head><body>
<div class="top">Cajitas Porta-Rosario</div>
<main class="wrap">

<p class="sub">Completa los datos y se arma una hoja A4 con 10 etiquetas iguales, lista para imprimir y recortar.</p>
<div class="panel">

 <div><label>Modelo de cajita</label><select id="mo"></select></div>

 <div><label>Fecha</label><input id="fe" value="12/10/2026" maxlength="24"></div>
 <div><label>Parroquia (opcional)</label><input id="pa" value="Parroquia San José" maxlength="40"></div>
 <div><label>Mensaje corto (opcional)</label><input id="me" value="Gracias por acompañarme" maxlength="50"></div>
 <div class="full"><label>Color</label><div class="cols" id="cols"></div></div>
</div>
<div class="acts"><button class="btn" onclick="window.print()">Imprimir / Guardar PDF</button></div>
<p class="hint">Imprime al 100 % (sin «ajustar a la página»). Desde el móvil elige «Guardar como PDF» y llévalo a la copiadora.</p>
<div class="prev"><div class="hoja" id="hoja"></div></div>
</main>
